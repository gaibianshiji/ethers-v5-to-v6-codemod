name: Publish Codemod

on:
  push:
    branches: [master]
    paths:
      - 'codemod.yaml'
      - 'workflow.yaml'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish to Codemod Registry
        uses: codemod/publish-action@v1
